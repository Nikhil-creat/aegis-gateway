name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gateway } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: gateway/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      # Fails the build if smart routing loses >10 pts of pass rate vs always-strong or saves <30% cost.
      - run: python -m evals.benchmark --max-drop 0.10 --min-savings 0.30
      - uses: actions/upload-artifact@v4
        with: { name: benchmark-report, path: gateway/artifacts/ }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t aegis-gateway:ci gateway
      - name: Smoke test the container
        run: |
          docker run -d --name aegis -p 8000:8000 aegis-gateway:ci
          for i in $(seq 1 20); do curl -fs http://localhost:8000/healthz && break; sleep 2; done
          curl -fs http://localhost:8000/healthz
          curl -fs http://localhost:8000/metrics | grep -q aegis_requests_total

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm test   # typecheck, Python/TypeScript parity, build, SEO + bundle audit
